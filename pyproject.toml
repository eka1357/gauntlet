[project]
name = "gauntlet"
version = "0.1.0"
description = "Gauntlet hardens AI agents before they ship."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "pydantic>=2.0",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sse-starlette>=2.0",
    "python-dotenv>=1.0",
    "tavily-python>=0.5",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
include = ["backend*", "target*", "jobs*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "target", "jobs", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
